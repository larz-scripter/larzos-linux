name: windows-launcher-ci

# Build-checks for the LarzOS Windows app (windows/). The release artifacts -
# LarzOS.exe + rootfs, and the signed MSIX - are produced by release.yml on a
# tag; this workflow proves both still build on every push that touches windows/.

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build LarzOS.exe (x64 + ARM64, Release)
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                  Where-Object Name -match '^10\.' | Sort-Object Name | Select-Object -Last 1).Name
          Write-Host "Windows SDK: $sdk"
          foreach ($p in 'x64','ARM64') {
            msbuild windows\DistroLauncher\LarzOS.vcxproj `
              /p:Configuration=Release /p:Platform=$p `
              /p:WindowsTargetPlatformVersion=$sdk `
              /p:OutDir=$PWD\build\$p\ /m /nologo
            if ($LASTEXITCODE -ne 0) { throw "build failed for $p" }
          }
          Get-ChildItem -Recurse build -Filter LarzOS.exe | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: LarzOS-exe
          path: |
            build/x64/LarzOS.exe
            build/ARM64/LarzOS.exe

  msix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Stub rootfs for the packaging build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows\x64 | Out-Null
          "stub - the real rootfs is injected on release" | Out-File -Encoding ascii windows\x64\stub
          tar -czf windows\x64\install.tar.gz -C windows\x64 stub

      - name: Self-signed signing certificate (CN=Larz Scripter)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Larz Scripter" `
            -KeyUsage DigitalSignature -FriendlyName "LarzOS CI (test)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "larzos" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -Password $pw `
            -FilePath windows\DistroLauncher-Appx\LarzOS-Appx_TemporaryKey.pfx | Out-Null

      - name: Build the LarzOS MSIX (x64)
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                  Where-Object Name -match '^10\.' | Sort-Object Name | Select-Object -Last 1).Name
          $sln = "$PWD\windows\"

          # 1. Build the launcher.
          msbuild windows\DistroLauncher\LarzOS.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=$sln `
            /p:WindowsTargetPlatformVersion=$sdk /m /nologo
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }

          # 2. Stage it where the Appx project's custom-build reads it:
          #    $(SolutionDir)$(Platform)\$(Configuration)\LarzOS.exe
          $exe = (Get-ChildItem -Recurse $sln -Filter LarzOS.exe |
                  Where-Object FullName -notmatch 'Appx' | Select-Object -First 1).FullName
          if (-not $exe) { throw "LarzOS.exe not found after launcher build" }
          New-Item -ItemType Directory -Force "$sln`x64\Release" | Out-Null
          Copy-Item $exe "$sln`x64\Release\LarzOS.exe" -Force
          Write-Host "staged $exe"

          # 3. Package + sign.
          msbuild windows\DistroLauncher-Appx\DistroLauncher-Appx.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=$sln `
            /p:WindowsTargetPlatformVersion=$sdk `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=LarzOS-Appx_TemporaryKey.pfx `
            /p:PackageCertificatePassword=larzos `
            /m /nologo
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }

          $pkgs = Get-ChildItem -Recurse windows -Include *.msix,*.msixbundle
          $pkgs | Select-Object FullName, Length
          if (-not $pkgs) { throw "no .msix produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: LarzOS-msix
          path: |
            windows/**/*.msix
            windows/**/*.msixbundle
          if-no-files-found: warn
