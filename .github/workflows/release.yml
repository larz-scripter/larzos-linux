name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Larzscript
        run: |
          curl -fsSL https://github.com/larz-scripter/larzscript/releases/latest/download/larzscript-linux-x86_64 -o /usr/local/bin/larzscript
          chmod +x /usr/local/bin/larzscript

      - name: Build packages (amd64 + arch:all + arm64 interpreter)
        run: |
          export LARZSCRIPT_PATH=lib
          [ "$GITHUB_REF_TYPE" = tag ] && export LARZOS_VERSION="${GITHUB_REF_NAME#v}"
          make packages
          LARZOS_ARCH=arm64 larzscript bin/larz-pkg deb packages/larzscript
          ls -la dist/

      - name: Publish to the apt repo
        env:
          KEY: ${{ secrets.LARZOS_DEPLOY_KEY }}
          HOST: ${{ secrets.LARZOS_DEPLOY_HOST }}
        run: |
          printf '%s\n' "$KEY" > key && chmod 600 key
          tar -c -C dist . | ssh -i key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST"
          rm -f key

      - name: Attach .deb files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
