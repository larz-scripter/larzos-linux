name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Larzscript
        run: |
          curl -fsSL https://github.com/larz-scripter/larzscript/releases/latest/download/larzscript-linux-x86_64 -o /usr/local/bin/larzscript
          chmod +x /usr/local/bin/larzscript

      - name: Build packages (amd64 + arch:all + arm64 interpreter)
        run: |
          export LARZSCRIPT_PATH=lib
          [ "$GITHUB_REF_TYPE" = tag ] && export LARZOS_VERSION="${GITHUB_REF_NAME#v}"
          make packages
          LARZOS_ARCH=arm64 larzscript bin/larz-pkg deb packages/larzscript
          ls -la dist/

      - name: Publish .debs to the apt repo
        env:
          KEY: ${{ secrets.LARZOS_DEPLOY_KEY }}
          HOST: ${{ secrets.LARZOS_DEPLOY_HOST }}
        run: |
          printf '%s\n' "$KEY" > key && chmod 600 key
          tar -c -C dist $(cd dist && ls *.deb) | ssh -i key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST"
          rm -f key

      - name: Build the rootfs image (shared base for WSL / Docker / ISO)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring imagemagick
          V="${GITHUB_REF_NAME#v}"
          sudo OUT="dist/larzos-rootfs-amd64-$V.tar.gz" LARZOS_APT_BASE=https://larzos.com/apt \
            sh tools/build-rootfs.sh
          sudo chown -R "$USER" dist
          # The rootfs carries /etc/wsl-distribution.conf, so it doubles as a
          # branded LarzOS WSL distribution: `wsl --install --from-file *.wsl`.
          cp "dist/larzos-rootfs-amd64-$V.tar.gz" "dist/larzos-$V.wsl"
          (cd dist && sha256sum larzos-rootfs-amd64-$V.tar.gz larzos-$V.wsl > larzos-amd64-$V.sha256)

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.wsl
            dist/*.sha256
          generate_release_notes: true

  # arm64 rootfs - the base image the LarzOS phone app downloads, and the arm64
  # WSL / container base. Built natively on a free public-repo arm64 runner so
  # no qemu-user is needed. Runs after `publish` so the LarzOS apt repo already
  # has this tag's packages.
  rootfs-arm64:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the arm64 rootfs
        run: |
          # build-rootfs.sh needs no host larzscript: the LarzOS stack is
          # installed inside the chroot from the apt repo (arm64 packages),
          # and check-branding.sh is plain sh.
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring
          V="${GITHUB_REF_NAME#v}"
          sudo ARCH=arm64 OUT="dist/larzos-rootfs-arm64-$V.tar.gz" \
            LARZOS_APT_BASE=https://larzos.com/apt sh tools/build-rootfs.sh
          sudo chown -R "$USER" dist
          (cd dist && sha256sum larzos-rootfs-arm64-$V.tar.gz > larzos-rootfs-arm64-$V.tar.gz.sha256)
          ls -la dist/

      - name: Attach the arm64 rootfs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/larzos-rootfs-arm64-*.tar.gz
            dist/larzos-rootfs-arm64-*.sha256

  # The Windows installers. Two shapes, same engine setup on first run:
  #   * LarzOS_<ver>_x64.msix  - LarzOS as an installed app (Start tile, icon)
  #   * LarzOS-WSL-<ver>-*.zip  - loose LarzOS.exe + rootfs + offline wsl.msi
  # On a PC with no WSL, LarzOS.exe turns the Linux engine on itself.
  # Needs both rootfs jobs so the x64 and arm64 tarballs are on the release.
  windows-launcher:
    needs: [publish, rootfs-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Resolve the Windows SDK
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                  Where-Object Name -match '^10\.' | Sort-Object Name | Select-Object -Last 1).Name
          "SDK=$sdk" | Out-File -Append $env:GITHUB_ENV

      - name: Build LarzOS.exe (x64 + ARM64, Release)
        shell: pwsh
        run: |
          foreach ($p in 'x64','ARM64') {
            msbuild windows\DistroLauncher\LarzOS.vcxproj `
              /p:Configuration=Release /p:Platform=$p `
              /p:WindowsTargetPlatformVersion=$env:SDK `
              /p:OutDir=$PWD\build\$p\ /m /nologo
            if ($LASTEXITCODE -ne 0) { throw "launcher build failed for $p" }
          }

      - name: Fetch the offline WSL runtime (MIT, github.com/microsoft/WSL)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($a in 'x64','arm64') {
            gh release download --repo microsoft/WSL --pattern "*.$a.msi" --output "wsl-$a.msi" --clobber
            if ($LASTEXITCODE -ne 0) { Write-Warning "no WSL $a MSI on the latest release - that arch falls back to 'wsl --install'" }
          }
          if (-not (Test-Path wsl-x64.msi)) { throw "the x64 WSL MSI is required" }
          Get-ChildItem wsl-*.msi -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Build the LarzOS MSIX (x64, self-signed)
        shell: pwsh
        run: |
          $sln = "$PWD\windows\"
          New-Item -ItemType Directory -Force "$sln`x64\Release" | Out-Null
          gh release download "${{ github.ref_name }}" --pattern "larzos-rootfs-amd64-*.tar.gz" --output "$sln`x64\install.tar.gz" --clobber
          Copy-Item build\x64\LarzOS.exe "$sln`x64\Release\LarzOS.exe" -Force
          Copy-Item wsl-x64.msi "$sln`DistroLauncher-Appx\wsl.msi" -Force

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Larz Scripter" `
            -KeyUsage DigitalSignature -FriendlyName "LarzOS (self-signed)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "larzos" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -Password $pw `
            -FilePath windows\DistroLauncher-Appx\LarzOS-Appx_TemporaryKey.pfx | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null
          Export-Certificate -Cert $cert -FilePath dist\LarzOS.cer | Out-Null

          msbuild windows\DistroLauncher-Appx\DistroLauncher-Appx.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=$sln `
            /p:WindowsTargetPlatformVersion=$env:SDK `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=LarzOS-Appx_TemporaryKey.pfx `
            /p:PackageCertificatePassword=larzos /m /nologo
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed" }

          $V = "${{ github.ref_name }}" -replace '^v',''
          $msix = Get-ChildItem -Recurse windows -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "no .msix produced" }
          Copy-Item $msix.FullName "dist/LarzOS_${V}_x64.msix"

      - name: Bundle each LarzOS.exe with its rootfs + offline engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $V = "${{ github.ref_name }}" -replace '^v',''
          gh release download "${{ github.ref_name }}" --pattern "larzos-rootfs-amd64-*.tar.gz" --output rootfs-x64.tar.gz --clobber
          gh release download "${{ github.ref_name }}" --pattern "larzos-rootfs-arm64-*.tar.gz" --output rootfs-arm64.tar.gz --clobber
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($a in @(@{plat='x64'; arch='x64'}, @{plat='ARM64'; arch='arm64'})) {
            $d = "pkg-$($a.arch)"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item "build/$($a.plat)/LarzOS.exe" "$d/LarzOS.exe"
            Copy-Item "rootfs-$($a.arch).tar.gz"    "$d/install.tar.gz"
            if (Test-Path "wsl-$($a.arch).msi") { Copy-Item "wsl-$($a.arch).msi" "$d/wsl.msi" }
            Copy-Item "windows/README.md"           "$d/README.txt"
            Copy-Item "windows/LICENSE"             "$d/LICENSE.txt"
            $zip = "dist/LarzOS-WSL-$V-$($a.arch).zip"
            Compress-Archive -Path "$d/*" -DestinationPath $zip -Force
          }
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Out-File -Encoding ascii "dist/LarzOS-windows-$V.sha256"
          Get-ChildItem dist

      - name: Attach the Windows installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LarzOS-WSL-*.zip
            dist/LarzOS_*_x64.msix
            dist/LarzOS.cer
            dist/LarzOS-windows-*.sha256
