name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Larzscript
        run: |
          curl -fsSL https://github.com/larz-scripter/larzscript/releases/latest/download/larzscript-linux-x86_64 -o /usr/local/bin/larzscript
          chmod +x /usr/local/bin/larzscript

      - name: Build packages (amd64 + arch:all + arm64 interpreter)
        run: |
          export LARZSCRIPT_PATH=lib
          [ "$GITHUB_REF_TYPE" = tag ] && export LARZOS_VERSION="${GITHUB_REF_NAME#v}"
          make packages
          LARZOS_ARCH=arm64 larzscript bin/larz-pkg deb packages/larzscript
          ls -la dist/

      - name: Publish .debs to the apt repo
        env:
          KEY: ${{ secrets.LARZOS_DEPLOY_KEY }}
          HOST: ${{ secrets.LARZOS_DEPLOY_HOST }}
        run: |
          printf '%s\n' "$KEY" > key && chmod 600 key
          tar -c -C dist $(cd dist && ls *.deb) | ssh -i key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "root@$HOST"
          rm -f key

      - name: Build the rootfs image (shared base for WSL / Docker / ISO)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring imagemagick
          V="${GITHUB_REF_NAME#v}"
          sudo OUT="dist/larzos-rootfs-amd64-$V.tar.gz" LARZOS_APT_BASE=https://larzos.com/apt \
            sh tools/build-rootfs.sh
          sudo chown -R "$USER" dist
          # The rootfs carries /etc/wsl-distribution.conf, so it doubles as a
          # branded LarzOS WSL distribution: `wsl --install --from-file *.wsl`.
          cp "dist/larzos-rootfs-amd64-$V.tar.gz" "dist/larzos-$V.wsl"
          (cd dist && sha256sum larzos-rootfs-amd64-$V.tar.gz larzos-$V.wsl > larzos-amd64-$V.sha256)

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.wsl
            dist/*.sha256
          generate_release_notes: true

  # arm64 rootfs - the base image the LarzOS phone app downloads, and the arm64
  # WSL / container base. Built natively on a free public-repo arm64 runner so
  # no qemu-user is needed. Runs after `publish` so the LarzOS apt repo already
  # has this tag's packages.
  rootfs-arm64:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the arm64 rootfs
        run: |
          # build-rootfs.sh needs no host larzscript: the LarzOS stack is
          # installed inside the chroot from the apt repo (arm64 packages),
          # and check-branding.sh is plain sh.
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring
          V="${GITHUB_REF_NAME#v}"
          sudo ARCH=arm64 OUT="dist/larzos-rootfs-arm64-$V.tar.gz" \
            LARZOS_APT_BASE=https://larzos.com/apt sh tools/build-rootfs.sh
          sudo chown -R "$USER" dist
          (cd dist && sha256sum larzos-rootfs-arm64-$V.tar.gz > larzos-rootfs-arm64-$V.tar.gz.sha256)
          ls -la dist/

      - name: Attach the arm64 rootfs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/larzos-rootfs-arm64-*.tar.gz
            dist/larzos-rootfs-arm64-*.sha256

  # The double-click Windows installer: LarzOS.exe (the rebranded WSL
  # distro-launcher, windows/) bundled with the rootfs as install.tar.gz.
  # Extract the zip, run LarzOS.exe, and LarzOS registers itself in WSL.
  # Needs both rootfs jobs so the x64 and arm64 tarballs are on the release.
  windows-launcher:
    needs: [publish, rootfs-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build LarzOS.exe (x64 + ARM64, Release)
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                  Where-Object Name -match '^10\.' | Sort-Object Name | Select-Object -Last 1).Name
          Write-Host "Windows SDK: $sdk"
          foreach ($p in 'x64','ARM64') {
            msbuild windows\DistroLauncher\LarzOS.vcxproj `
              /p:Configuration=Release /p:Platform=$p `
              /p:WindowsTargetPlatformVersion=$sdk `
              /p:OutDir=$PWD\build\$p\ /m /nologo
            if ($LASTEXITCODE -ne 0) { throw "build failed for $p" }
          }

      - name: Bundle each LarzOS.exe with its rootfs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $V = "${{ github.ref_name }}" -replace '^v',''
          gh release download "${{ github.ref_name }}" --pattern "larzos-rootfs-amd64-*.tar.gz" --output rootfs-x64.tar.gz
          gh release download "${{ github.ref_name }}" --pattern "larzos-rootfs-arm64-*.tar.gz" --output rootfs-arm64.tar.gz
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($a in @(@{plat='x64'; arch='x64'}, @{plat='ARM64'; arch='arm64'})) {
            $d = "pkg-$($a.arch)"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item "build/$($a.plat)/LarzOS.exe" "$d/LarzOS.exe"
            Copy-Item "rootfs-$($a.arch).tar.gz"    "$d/install.tar.gz"
            Copy-Item "windows/README.md"           "$d/README.txt"
            Copy-Item "windows/LICENSE"             "$d/LICENSE.txt"
            $zip = "dist/LarzOS-WSL-$V-$($a.arch).zip"
            Compress-Archive -Path "$d/*" -DestinationPath $zip -Force
            (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Out-File -Append -Encoding ascii "dist/LarzOS-WSL-$V.sha256"
          }
          Get-ChildItem dist

      - name: Attach the Windows installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LarzOS-WSL-*.zip
            dist/LarzOS-WSL-*.sha256
